# Publishes cheaprouter to the official MCP registry (registry.modelcontextprotocol.io)
# via GitHub OIDC — no stored secret needed. The registry entry POINTS AT the MCPize
# endpoint in server.json; it does not host anything. Discovery layer, not hosting.
#
# BEFORE THE FIRST PUBLISH: set the real MCPize endpoint in server.json
# (remotes[0].url) — it ships as a placeholder "https://YOUR-ENDPOINT.mcpize.run/mcp".
# github-oidc login only authorizes the io.github.carlosalbertorussell/* namespace,
# which is why this workflow must live in this GitHub repo/account (CR-07).
#
# Triggers on a version tag (vX.Y.Z) or a manual run.

name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for github-oidc login
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
