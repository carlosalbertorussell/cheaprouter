name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Compile check
        run: python -m py_compile *.py scripts/*.py

      - name: Run tests with coverage
        # No network: tests/conftest.py fails any test that opens a real httpx
        # connection. The floor sits a few points below the measured total
        # (96.6% at ST1) so it catches lost coverage without flaking.
        run: >-
          python -m pytest tests/ -v
          --cov=client --cov=health --cov=history --cov=price_history
          --cov=pricing --cov=pricing_server --cov=pricing_table --cov=providers
          --cov=provenance --cov=refresh --cov=router --cov=server --cov=storage
          --cov=tokens
          --cov-report=term-missing
          --cov-fail-under=92

  price-freshness:
    # Non-blocking: surfaces stale prices as a visible signal without failing the
    # build or gating merges. A red mark here means "prices need a human", which is
    # a different signal from "code is broken" (that's the test job above).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check price-table freshness
        run: python scripts/check_prices.py
