name: cheaprouter
version: 1.1.0
description: "BYOK MCP router that sends each LLM completion to the cheapest provider in the capability tier you pick, across 8 providers (Anthropic, OpenAI, Google Gemini, Groq, Mistral, DeepSeek, Alibaba Qwen, xAI Grok). Cheapest-per-tier routing with prompt-caching-aware costing, tiktoken token counting, provider health tracking, automatic failover, optional streaming, and per-session spend analytics with budget alerts. Users supply their own provider keys per request; the server stores no keys and no content, and never uses provider keys of its own. Prices are versioned and staleness-guarded — routing refuses on stale prices rather than misprice."
runtime: python
entrypoint: server.py

build:
  command: pip install -r requirements.txt

env:
  # Routing
  LATENCY_THRESHOLD_MS: "300"       # exclude providers slower than this when latency_sensitive
  BLOCKED_REGIONS: ""               # comma-sep regions to hard-block, e.g. "cn"
  PORT: "8081"

  # Provider API keys: do NOT set them here or as MCPize secrets. Over HTTP the
  # server uses only keys callers pass in api_keys and ignores provider key env
  # vars. ARBITRAGE_ALLOW_ENV_KEYS=1 would let any caller spend them — leave unset.

  # Provider health (S8) — tuning; sane defaults, override only if needed
  HEALTH_WINDOW: "50"
  HEALTH_MIN_SAMPLES: "3"
  HEALTH_THRESHOLD: "0.5"
  HEALTH_MAX_PER_SESSION: "5"       # ST5: most records one session adds to a provider's score
  HEALTH_MIN_SESSIONS: "2"          # ST5: distinct failing sessions to mark unhealthy (HTTP default 2; stdio defaults to 1)

  # History reads (ST5) — "1" lets callers without a session read EVERY session's
  # records and spend. Off by default: no session reads only the shared anon session.
  ARBITRAGE_ALLOW_GLOBAL_READS: ""

  # Spend analytics (S1) — set both to persist across redeploys; else ephemeral JSONL
  # UPSTASH_REDIS_REST_URL: ""
  # UPSTASH_REDIS_REST_TOKEN: ""
  ARBITRAGE_HISTORY_FILE: "/tmp/routing_history.jsonl"

  # Price-table guard (S4a) — set to "1" to route on stale prices with a warning
  ARBITRAGE_ALLOW_STALE_PRICES: ""

  # Waist interaction (SP1d) — set to "1" to emit observed price signals to history
  ARBITRAGE_EMIT_OBSERVED: ""
